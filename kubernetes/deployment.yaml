apiVersion: apps/v1
kind: Deployment
metadata:
  name: jessicai-app
  namespace: jessicai
  labels:
    app: jessicai-app
    version: "1.0.0"
  annotations:
    # GPG signature annotation: store the armored detached signature of the manifest
    security.jessicai/gpg-signature: ""
    # SHA256 digest of the container image (e.g. sha256:<hex>)
    security.jessicai/image-sha256: ""
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jessicai-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jessicai-app
        version: "1.0.0"
    spec:
      # Run as a non-root user to limit blast radius
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Only pull images that match the pinned SHA256 digest
      containers:
        - name: jessicai-app
          # Always pin to a SHA256 digest — never use a mutable tag alone
          image: ghcr.io/nato1000/jessicai-app@sha256:REPLACE_WITH_ACTUAL_SHA256
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: APP_ENV
              value: "production"
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Tolerate no failures on critical security checks
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
