apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jessicai-default-deny
  namespace: jessicai
spec:
  # Select all pods in the namespace
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jessicai-allow-app-ingress
  namespace: jessicai
spec:
  podSelector:
    matchLabels:
      app: jessicai-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jessicai-allow-app-egress-dns
  namespace: jessicai
spec:
  podSelector:
    matchLabels:
      app: jessicai-app
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
